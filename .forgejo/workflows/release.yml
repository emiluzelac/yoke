name: Release

# Publishes a version tag. Yoke's canonical repository is on our own Forgejo
# (since 2026-11-15), and so is its publishing: a release is cut with
# `node scripts/release.mjs <version>` (RELEASING.md), and the v* tag it pushes
# runs this workflow in a disposable VM. It tests and packages the VSIX,
# publishes it to the VS Code Marketplace (secret VSCE_PAT) and, when the secret
# OVSX_PAT is set, to Open VSX, and creates the Forgejo release with the
# CHANGELOG.md section as its notes and the VSIX attached. GitHub's copy is a
# push mirror and runs no publishing.
#
# Run it by hand (workflow_dispatch) to publish an existing tag again, for
# example after a store refused it: a store that has the version already skips
# it. With `publish` off it does everything but publish: it checks the token,
# and creates and deletes a draft release, to prove the path works.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: An existing tag, e.g. v0.3.0
        required: true
      publish:
        description: Publish (off = build, test, package and check the tokens only)
        type: boolean
        default: true

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: [self-hosted, linux, x64, iam-ci-isolated]
    timeout-minutes: 30
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      PUBLISH: ${{ github.event_name == 'push' || github.event.inputs.publish == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: refs/tags/${{ env.TAG }}

      - name: The tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "Tag $TAG does not match package.json version $version." >&2
            exit 1
          fi

      # Outside the workspace, so nothing of the release's own lands in the VSIX.
      - name: Release notes from CHANGELOG.md
        run: |
          out=$(mktemp -d)
          awk -v v="${TAG#v}" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > "$out/notes.md"
          test -s "$out/notes.md" || { echo "No CHANGELOG.md section for $TAG" >&2; exit 1; }
          echo "RELEASE_DIR=$out" >> "$GITHUB_ENV"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm test

      - run: rm -rf dist && mkdir -p dist && npm run package

      - name: Locate the VSIX
        run: |
          shopt -s nullglob
          files=(dist/*.vsix)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "Expected exactly one VSIX in dist, found ${#files[@]}" >&2
            exit 1
          fi
          echo "VSIX=${files[0]}" >> "$GITHUB_ENV"

      - name: The Marketplace token reaches the publisher
        run: npm exec -- vsce verify-pat "$(node -p "require('./package.json').publisher")"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to the VS Code Marketplace
        if: env.PUBLISH == 'true'
        run: npm exec -- vsce publish --packagePath "$VSIX" --skip-duplicate
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX (only with the OVSX_PAT secret)
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "OVSX_PAT is not set on this repository: Open VSX skipped (Yoke has never been published there)."
          elif [ "$PUBLISH" = true ]; then
            npm exec -- ovsx publish --skip-duplicate "$VSIX"
          else
            npm exec -- ovsx verify-pat "$(node -p "require('./package.json').publisher")"
          fi
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      # The helper comes from the workflow's own commit, so an older tag published again
      # (which predates it) works too.
      - name: The release helper
        run: |
          git -C "$RELEASE_DIR" init -q tools
          git -C "$RELEASE_DIR/tools" fetch -q --depth 1 "${{ github.server_url }}/${{ github.repository }}.git" "${{ github.sha }}"
          git -C "$RELEASE_DIR/tools" checkout -q FETCH_HEAD -- scripts/forgejo-release.mjs
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: http.extraHeader
          GIT_CONFIG_VALUE_0: "Authorization: token ${{ github.token }}"

      - name: The Forgejo release, with the VSIX
        run: node "$RELEASE_DIR/tools/scripts/forgejo-release.mjs" "$TAG" "$RELEASE_DIR/notes.md" "$VSIX" $([ "$PUBLISH" = true ] || echo --dry-run)
        env:
          FORGEJO_API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          FORGEJO_TOKEN: ${{ github.token }}
