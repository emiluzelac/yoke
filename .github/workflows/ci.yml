name: CI

# Pull requests opened on GitHub only. Since 2026-11-15 Yoke's canonical
# repository and its CI are on our own Forgejo (.forgejo/workflows/ci.yml),
# which mirrors every push here; this keeps a check for an outside
# contributor's pull request, on GitHub-hosted runners (a public repository
# never runs on the estate's machines). A change that lands goes in through
# Forgejo.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run format:check

      - run: npm run compile

      - run: npm test

      - run: mkdir -p dist && npm run package

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deepseek-v4-for-copilot.vsix
          path: dist/*.vsix
          retention-days: 30
