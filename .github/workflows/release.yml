name: Release

# Publishes a version tag. Since 2026-11-15 Yoke's canonical repository is
# emiluzelac/yoke on our own Forgejo, which mirrors every push here; a release
# is cut there with `node scripts/release.mjs <version>` (changelog section,
# version bump, tag v<version>), and the tag's arrival through the mirror runs
# this workflow. It replaced release-please, whose release PRs merged on GitHub
# and would be overwritten by the mirror. GitHub-hosted runners: this is a
# public repository, and the publishing secrets live here.

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: publish-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The tag matches package.json
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version." >&2
            exit 1
          fi

      - name: Release notes from CHANGELOG.md
        shell: bash
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md" || { echo "No CHANGELOG.md section for $GITHUB_REF_NAME" >&2; exit 1; }

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm test

      - run: rm -rf dist && mkdir -p dist && npm run package

      - name: Locate VSIX
        id: vsix
        shell: bash
        run: |
          shopt -s nullglob
          files=(dist/*.vsix)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "Expected exactly one VSIX in dist, found ${#files[@]}" >&2
            printf '%s\n' "${files[@]}" >&2
            exit 1
          fi
          echo "path=${files[0]}" >> "$GITHUB_OUTPUT"

      - name: Publish to VS Code Marketplace
        if: vars.PUBLISH_VSCODE_MARKETPLACE != 'false'
        run: npm exec -- vsce publish --packagePath "${{ steps.vsix.outputs.path }}" --skip-duplicate
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX
        if: vars.PUBLISH_OPEN_VSX != 'false'
        run: npm exec -- ovsx publish --skip-duplicate "${{ steps.vsix.outputs.path }}"
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      - name: Create the GitHub Release with the VSIX
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/notes.md
          files: ${{ steps.vsix.outputs.path }}
          fail_on_unmatched_files: true

      - name: Show release info
        run: |
          echo "Released ${{ github.ref_name }}"
